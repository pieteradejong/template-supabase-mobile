name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for tracked secrets files
        run: |
          FORBIDDEN_FILES=$(git ls-files | grep -E '\.env\.local$|env\.local$|\.env$' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::Secrets files should never be committed to git:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi

      - name: Run tests
        run: ./scripts/test.sh --ci
